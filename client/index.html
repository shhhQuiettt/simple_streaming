<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X11 Window Stream Viewer</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #eee;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            padding: 10px 20px;
            background: #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #video-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            max-width: 100%;
            max-height: 100%;
            background: #000;
            /* Allow fullscreen easily */
        }
        #status {
            font-weight: bold;
        }
        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }
        .connecting { color: #FFC107; }
        
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="header">
        <h2>X11 Window Stream</h2>
        <div>
            Status: <span id="status" class="disconnected">Disconnected</span>
            <button id="fullscreen-btn">Fullscreen</button>
        </div>
    </div>
    
    <div id="video-container">
        <!-- autoplay and muted are important for auto-starting video in browsers without interaction -->
        <video id="stream" autoplay playsinline muted></video>
    </div>

    <script src="main.js"></script>
</body>
</html>
